<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#eef1ff;--card:#fff;--ink:#14163a;--mute:#5b5f8a;--line:#cfd4f5;--accent:#6c5ce7;--gold:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101226;--card:#1c1f3d;--ink:#f1f2ff;--mute:#9a9fcf;--line:#34386a;--accent:#8f82ff}}
:root[data-theme="dark"]{--bg:#101226;--card:#1c1f3d;--ink:#f1f2ff;--mute:#9a9fcf;--line:#34386a;--accent:#8f82ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:16px;display:flex;justify-content:center}
.screen{width:100%;max-width:1000px;display:none;flex-direction:column;gap:14px}
.screen.on{display:flex}
h1{margin:4px 0;font-size:1.7rem;letter-spacing:.5px}
.sub{color:var(--mute);margin:0}
button{font:inherit;font-weight:700;padding:9px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
button.sm{padding:4px 10px;font-size:.85rem}
button:disabled{cursor:default}
input{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cat,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cattop{display:flex;gap:8px;margin-bottom:8px}
.cattop input{font-weight:800}
.qr{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;margin-top:6px;align-items:center}
.pts{font-weight:800;color:var(--accent);text-align:center}
.teamrow{display:flex;gap:8px;margin-top:6px}
.board{display:grid;gap:6px}
.head{background:#0f1a6b;color:#fff;font-weight:800;text-align:center;padding:12px 4px;border-radius:8px;font-size:clamp(.7rem,2.2vw,1.1rem);display:flex;align-items:center;justify-content:center;text-transform:uppercase;min-height:64px;word-break:break-word}
.tile{background:linear-gradient(#2d44e0,#1a2a9a);color:var(--gold);font-weight:900;font-size:clamp(1.3rem,5vw,2.6rem);border-radius:8px;padding:0;min-height:clamp(56px,11vw,96px);text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.tile:hover:not(:disabled){filter:brightness(1.2);transform:scale(1.03)}
.tile.used{background:rgba(120,125,170,.18);box-shadow:none}
.score{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.team{flex:1 1 150px;max-width:260px;background:var(--card);border:3px solid var(--c);border-radius:14px;padding:10px;text-align:center}
.team b{display:block;font-size:1rem}
.team .n{font-size:2.2rem;font-weight:900;color:var(--c)}
.team .adj{display:flex;gap:6px;justify-content:center}
.status{text-align:center;font-weight:800;font-size:1.3rem;min-height:1.6rem}
.ov{position:fixed;inset:0;background:rgba(5,7,25,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.on{display:flex}
.modal{background:var(--card);border:3px solid var(--gold);border-radius:20px;padding:22px;width:min(100%,760px);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.mh{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.mq{font-size:clamp(1.4rem,4.5vw,2.4rem);font-weight:800;line-height:1.25}
.ma{font-size:clamp(1.2rem,4vw,2rem);font-weight:800;color:#1faa59;min-height:2.4rem}
.tm{font-size:1.6rem;font-weight:900;color:var(--mute)}
.tm.low{color:#e5484d}
:root{--hd:"Lilita One","Baloo 2","Trebuchet MS",system-ui,sans-serif;--bd:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{font-family:var(--bd);background:radial-gradient(circle at 8% 10%,rgba(255,92,172,.28) 0 130px,transparent 132px),radial-gradient(circle at 92% 18%,rgba(70,214,255,.30) 0 170px,transparent 172px),radial-gradient(circle at 80% 92%,rgba(255,210,63,.28) 0 150px,transparent 152px),radial-gradient(circle at 10% 88%,rgba(140,110,255,.30) 0 160px,transparent 162px),var(--bg);background-attachment:fixed}
h1{font-family:var(--hd);font-weight:400;font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:1px;background:linear-gradient(90deg,#ff4d9d,#ff9a3c,#ffd23f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
button{font-family:var(--hd);font-weight:400;letter-spacing:.5px;font-size:1.05rem;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s,filter .1s}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.ghost{box-shadow:0 3px 0 var(--line)}
button.sm{font-size:.9rem}
#start{background:linear-gradient(#ff7ab8,#ff3d8a);font-size:1.4rem;padding:12px 32px}
input{font-family:var(--bd);border:2px solid var(--line);border-radius:12px}
input:focus{outline:3px solid var(--accent);outline-offset:1px}
.cat,.box{border-radius:20px;border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.cattop input{font-family:var(--hd);font-weight:400;font-size:1.15rem}
.pts{font-family:var(--hd);font-weight:400;font-size:1.25rem}
.board{gap:8px;padding:10px;border-radius:24px;background:linear-gradient(135deg,#1b1f6b,#4b1d8f);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.head{font-family:var(--hd);font-weight:400;letter-spacing:1px;background:linear-gradient(#ff5db1,#b13bff);border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.3);font-size:clamp(.8rem,2.4vw,1.25rem)}
.tile{font-family:var(--hd);font-weight:400;background:linear-gradient(#2fd4ff,#1a56e8);color:#fff6a8;border-radius:12px;font-size:clamp(1.5rem,5.5vw,3rem);box-shadow:0 5px 0 #0b2a8f,inset 0 0 0 2px rgba(255,255,255,.35);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.tile:hover:not(:disabled){filter:brightness(1.12);transform:scale(1.06) rotate(-1.5deg)}
.tile.used{background:rgba(255,255,255,.1);box-shadow:none}
.team{border-radius:22px;border-width:4px;box-shadow:0 5px 0 var(--c)}
.team b{font-family:var(--hd);font-weight:400;font-size:1.35rem}
.team .n{font-family:var(--hd);font-weight:400;font-size:3.2rem}
.status{font-family:var(--hd);font-weight:400;font-size:1.7rem;color:var(--accent)}
.modal{border:5px solid var(--gold);border-radius:28px;box-shadow:0 0 0 6px rgba(255,210,63,.3),0 20px 50px rgba(0,0,0,.5);animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.mh{font-family:var(--hd);font-weight:400;font-size:1.35rem;letter-spacing:1px}
.ma,.tm{font-family:var(--hd);font-weight:400}
@media (prefers-reduced-motion:reduce){.modal{animation:none}.tile:hover:not(:disabled){transform:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<section class="screen on" id="sEdit">
  <h1>🎯 Quiz Board</h1>
  <p class="sub">Edit the categories, questions and the student name. Changes are saved online and on this device.</p>
  <div class="sub" id="cloud"></div>
  <div class="box">
    <b>Student name</b> <span class="sub">(optional)</span>
    <div id="teamEd"></div>
    <div class="row" style="display:none"><button class="ghost sm" id="addTeam">＋ Add student</button></div>
  </div>
  <div class="cats" id="catEd"></div>
  <div class="row">
    <button class="ghost" id="addCat">＋ Add category</button>
    <button id="start" style="font-size:1.15rem;padding:12px 28px">Start game ➜</button>
    <button class="ghost" id="cont" style="display:none">▶ Continue game</button>
  </div>
</section>

<section class="screen" id="sGame">
  <div class="row" style="justify-content:space-between">
    <h1>🎯 Quiz Board</h1>
    <div class="row"><button class="ghost" id="edit">✏️ Edit questions</button><button class="ghost" id="again">↺ New game</button></div>
  </div>
  <div class="board" id="board"></div>
  <div class="status" id="status"></div>
  <div class="score" id="score"></div>
</section>

<div class="ov" id="ov">
  <div class="modal">
    <div class="mh" id="mh"></div>
    <div class="mq" id="mq"></div>
    <div class="ma" id="ma"></div>
    <div class="tm" id="tm"></div>
    <div class="row" style="justify-content:center">
      <button class="ghost" id="showA">Show answer</button>
      <button class="ghost" id="timer">⏱ Start 30s</button>
      <button class="ghost" id="back">Back to board</button>
    </div>
    <div class="sub">Mark the answer</div>
    <div class="row" id="who" style="justify-content:center"></div>
  </div>
</div>

<script>
// ===== PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API) =====
var SUPABASE_URL="https://jlfsaqzqsltqazazvgog.supabase.co";   // example: https://abcdxyz.supabase.co
var SUPABASE_KEY="sb_publishable_dnwoUYA4FBF2KSp27L-LzQ_Z58Y0O6v";   // the "anon" / "publishable" key
// =====================================================================
(function(){
  var $=function(id){return document.getElementById(id)};
  var PTS=[100,200,300,400,500],COL=["#e5484d","#1fa6c9","#f5a524","#3dbb6c","#8f5cf7","#e5509b","#0f9d8a","#d9772b"],KEY="quizboard-v1";
  function mk(name,a){return{name:name,qs:a.map(function(x){return{q:x[0],a:x[1],used:false}})}}
  function defaults(){
    return{
      teams:[{name:"Student 1",score:0}],
      cats:[
        mk("Vocabulary",[["What is the opposite of “ancient”?","Modern"],["A person who studies the stars is an …?","Astronomer"],["Give a synonym for “enormous”.","Huge / giant"],["What do we call a word with the same meaning as another word?","A synonym"],["What does “reluctant” mean?","Not willing; hesitant"]]),
        mk("Grammar",[["Past simple of “go”?","went"],["Fix it: “She don’t like pizza.”","She doesn’t like pizza."],["Complete: If I ___ rich, I would travel the world.","were / was"],["Present perfect: “I ___ (eat) lunch already.”","have eaten"],["Make it passive: “They built the bridge in 1990.”","The bridge was built in 1990."]]),
        mk("Idioms",[["“It’s raining cats and dogs” means …?","It is raining very heavily."],["What does “break the ice” mean?","Start a conversation in an awkward situation"],["“A piece of cake” means …?","Very easy"],["“Hit the books” means …?","Study hard"],["“Spill the beans” means …?","Reveal a secret"]]),
        mk("World",[["What is the capital of Japan?","Tokyo"],["What is the largest ocean?","The Pacific Ocean"],["Which country is Machu Picchu in?","Peru"],["What is the longest river in Africa?","The Nile"],["What is the capital of Australia?","Canberra"]]),
        mk("Speaking",[["Name three fruits in 10 seconds.","Any three fruits"],["Describe your best friend in 3 sentences.","Open answer"],["Say “She sells seashells” three times fast.","Tongue twister!"],["Tell us about last weekend using 5 past tense verbs.","Open answer"],["Give 3 reasons why English is useful.","Open answer"]])
      ]
    };
  }
  var S=defaults();
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.cats&&p.teams)S=p}}catch(e){}
  S.teams.forEach(function(t){t.name=t.name.replace(/^Team (\d+)$/,"Student $1")});
  S.teams=S.teams.slice(0,1);
  var sb=null,saveTm=null;
  function setCloud(t){var e=$("cloud");if(e)e.textContent=t}
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(!sb)return;
    clearTimeout(saveTm);
    saveTm=setTimeout(function(){
      sb.from("quiz_boards").upsert({id:"main",data:S,updated_at:new Date().toISOString()}).then(function(r){
        setCloud(r.error?"⚠️ Could not save online: "+r.error.message:"☁️ Saved online");
      });
    },400);
  }
  function initCloud(){
    if(!(SUPABASE_URL&&SUPABASE_KEY&&window.supabase))return;
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    setCloud("☁️ Connecting…");
    sb.from("quiz_boards").select("data").eq("id","main").maybeSingle().then(function(r){
      if(r.error){setCloud("⚠️ Online save is not working: "+r.error.message);return}
      var d=r.data&&r.data.data;
      if(d&&d.cats&&d.teams){
        S=d;S.teams=S.teams.slice(0,1);
        renderEditor();
        if($("sGame").classList.contains("on"))renderBoard();
        setCloud("☁️ Loaded from your online save");
      }else{setCloud("☁️ Saved online");save()}
    });
  }
  function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function inp(v,ph,cb){var i=h("input");i.type="text";i.value=v;i.placeholder=ph;i.oninput=function(){cb(i.value);save()};return i}

  // ---------- editor ----------
  function renderEditor(){
    var t=$("teamEd");t.innerHTML="";
    S.teams.forEach(function(tm,i){
      var r=h("div","teamrow");
      r.appendChild(inp(tm.name,"Student name",function(v){tm.name=v}));
      var x=h("button","ghost sm","✕");x.onclick=function(){if(S.teams.length>1){S.teams.splice(i,1);save();renderEditor()}};
      t.appendChild(r);
    });
    $("addTeam").style.display=S.teams.length>=8?"none":"";
    var c=$("catEd");c.innerHTML="";
    S.cats.forEach(function(cat,ci){
      var card=h("div","cat"),top=h("div","cattop");
      top.appendChild(inp(cat.name,"Category name",function(v){cat.name=v}));
      var x=h("button","ghost sm","✕");x.onclick=function(){if(S.cats.length>2){S.cats.splice(ci,1);save();renderEditor()}};
      top.appendChild(x);card.appendChild(top);
      cat.qs.forEach(function(q,qi){
        var r=h("div","qr");
        r.appendChild(h("div","pts",String(PTS[qi])));
        r.appendChild(inp(q.q,"Question",function(v){q.q=v}));
        r.appendChild(inp(q.a,"Answer",function(v){q.a=v}));
        card.appendChild(r);
      });
      c.appendChild(card);
    });
    $("addCat").style.display=S.cats.length>=6?"none":"";
    var prog=S.cats.some(function(c){return c.qs.some(function(q){return q.used})});
    $("cont").style.display=prog?"":"none";
  }
  $("addTeam").onclick=function(){S.teams.push({name:"Student "+(S.teams.length+1),score:0});save();renderEditor()};
  $("addCat").onclick=function(){S.cats.push(mk("New category",PTS.map(function(){return["",""]})));save();renderEditor()};

  // ---------- game ----------
  function newGame(){
    S.teams.forEach(function(t,i){t.score=0;t.right=0;t.wrong=0;if(!t.name.trim())t.name="Student "+(i+1)});
    S.cats.forEach(function(c){c.qs.forEach(function(q){q.used=false})});
    save();
  }
  function show(id){["sEdit","sGame"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
  $("start").onclick=function(){newGame();show("sGame");renderBoard()};
  $("again").onclick=function(){newGame();renderBoard()};
  $("edit").onclick=function(){renderEditor();show("sEdit")};
  $("cont").onclick=function(){show("sGame");renderBoard()};

  function renderBoard(){
    var b=$("board");b.innerHTML="";
    b.style.gridTemplateColumns="repeat("+S.cats.length+",minmax(0,1fr))";
    S.cats.forEach(function(c){b.appendChild(h("div","head",c.name))});
    var left=0;
    for(var r=0;r<5;r++){
      S.cats.forEach(function(c,ci){
        var q=c.qs[r],t=h("button","tile",String(PTS[r]));
        if(q.used||!q.q.trim()){t.disabled=true;t.classList.add("used");t.textContent=""}
        else{left++;(function(rr){t.onclick=function(){openQ(ci,rr)}})(r)}
        b.appendChild(t);
      });
    }
    var s=$("score");s.innerHTML="";
    S.teams.forEach(function(tm,i){
      var d=h("div","team");d.style.setProperty("--c",COL[i%8]);
      d.appendChild(h("b",null,tm.name));
      d.appendChild(h("div","n",String(tm.score)));
      var a=h("div","adj"),m=h("button","ghost sm","−100"),p=h("button","ghost sm","+100");
      m.onclick=function(){tm.score-=100;save();renderBoard()};
      p.onclick=function(){tm.score+=100;save();renderBoard()};
      a.appendChild(m);a.appendChild(p);d.appendChild(a);s.appendChild(d);
    });
    var st=$("status");
    if(left===0){
      var max=Math.max.apply(null,S.teams.map(function(t){return t.score}));
      var w=S.teams.filter(function(t){return t.score===max}).map(function(t){return t.name});
      st.textContent=S.teams.length===1?"🎉 Well done"+(/^Student 1$/.test(S.teams[0].name)?"":", "+S.teams[0].name)+"! Final score: "+S.teams[0].score+" points ("+(S.teams[0].right||0)+" correct)":"🏆 "+(w.length>1?"It’s a tie: ":"Winner: ")+w.join(" & ")+"!";
    }else st.textContent="✅ "+(S.teams[0].right||0)+" correct · ❌ "+(S.teams[0].wrong||0)+" missed";
  }

  // ---------- question popup ----------
  var cur=null,tick=null,secs=0;
  function stopTimer(){clearInterval(tick);tick=null;$("tm").textContent="";$("tm").className="tm";$("timer").textContent="⏱ Start 30s"}
  function openQ(ci,r){
    cur={ci:ci,r:r};
    var q=S.cats[ci].qs[r];
    $("mh").textContent=S.cats[ci].name+" · "+PTS[r];
    $("mq").textContent=q.q;$("ma").textContent="";$("showA").textContent="Show answer";
    stopTimer();
    var w=$("who");w.innerHTML="";
    S.teams.forEach(function(tm,i){
      var b=h("button",null,"✓ "+(S.teams.length===1?"Correct":tm.name));b.style.background=COL[i%8];
      b.onclick=function(){tm.score+=PTS[r];tm.right=(tm.right||0)+1;done()};
      w.appendChild(b);
    });
    var n=h("button","ghost",S.teams.length===1?"✗ Wrong":"✗ No one");n.onclick=function(){var t=S.teams[0];t.wrong=(t.wrong||0)+1;done()};w.appendChild(n);
    $("ov").classList.add("on");
  }
  function done(){S.cats[cur.ci].qs[cur.r].used=true;close();save();renderBoard()}
  function close(){stopTimer();$("ov").classList.remove("on")}
  $("back").onclick=close;
  $("showA").onclick=function(){
    var q=S.cats[cur.ci].qs[cur.r],a=$("ma");
    if(a.textContent){a.textContent="";this.textContent="Show answer"}
    else{a.textContent=q.a||"(no answer written)";this.textContent="Hide answer"}
  };
  $("timer").onclick=function(){
    if(tick){stopTimer();return}
    secs=30;$("tm").textContent="⏱ "+secs;$("timer").textContent="Stop timer";
    tick=setInterval(function(){
      secs--;$("tm").textContent=secs>0?"⏱ "+secs:"⏰ Time is up!";
      if(secs<=10)$("tm").className="tm low";
      if(secs<=0){clearInterval(tick);tick=null;$("timer").textContent="⏱ Start 30s"}
    },1000);
  };

  renderEditor();
  initCloud();
})();
</script>
</body>
</html>
